workflows:
  ios-device-build:
    name: iOS Device Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build iOS App
        script: |
          xcodebuild -project DuoLikeAnimation.xcodeproj \
            -scheme DuoLikeAnimation \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            BUILD_DIR=$CM_BUILD_DIR/build
    artifacts:
      - $CM_BUILD_DIR/build/Debug-iphoneos/*.app
