workflows:
  ios-device-build:
    name: iOS Device Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Metal Toolchain
        script: |
          xcodebuild -downloadComponent MetalToolchain
      - name: Build and Package App
        script: |
          # 1. Compile into an unsigned archive structure
          xcodebuild archive \
            -project DuoLikeAnimation.xcodeproj \
            -scheme DuoLikeAnimation \
            -destination 'generic/platform=iOS' \
            -archivePath $CM_BUILD_DIR/DuoLikeAnimation.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

          # 2. Re-structure it manually into an IPA format payload
          mkdir -p $CM_BUILD_DIR/Payload
          cp -r $CM_BUILD_DIR/DuoLikeAnimation.xcarchive/Products/Applications/DuoLikeAnimation.app $CM_BUILD_DIR/Payload/
          
          # 3. Zip it up as a clean installation file
          cd $CM_BUILD_DIR
          zip -r DuoLikeAnimation.ipa Payload
    artifacts:
      - $CM_BUILD_DIR/*.ipa
